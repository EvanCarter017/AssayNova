# Managed by AssayNova demo installer v1. Only these two names belong to this site.
# Query strings, credentials, cookies and referrers are excluded from access logs.
log_format assaynova_demo_v1 '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    listen [::]:80;
    access_log /var/log/nginx/assaynova-demo-access.log assaynova_demo_v1;
    error_log /dev/null;
    server_name assaynovalabs.com www.assaynovalabs.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/assaynova-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://assaynovalabs.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    access_log /var/log/nginx/assaynova-demo-access.log assaynova_demo_v1;
    error_log /dev/null;
    server_name www.assaynovalabs.com;
    ssl_certificate /etc/letsencrypt/live/assaynovalabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assaynovalabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://assaynovalabs.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    access_log /var/log/nginx/assaynova-demo-access.log assaynova_demo_v1;
    error_log /dev/null;
    server_name assaynovalabs.com;
    ssl_certificate /etc/letsencrypt/live/assaynovalabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assaynovalabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != assaynovalabs.com) { return 421; }
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:4330;
        proxy_http_version 1.1;
        proxy_set_header Host assaynovalabs.com;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
