<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="admin-auth-mode" content="{{MODE}}"><meta name="admin-auth-csrf" content="{{CSRF}}"><title>{{TITLE}} · AssayNova Admin</title><link rel="stylesheet" href="/admin/login.css"><script type="module" src="/admin/login.js"></script></head>
<body><main class="login-shell"><a class="brand" href="/admin">AssayNova<span>ADMIN</span></a><section class="login-card" aria-labelledby="login-title"><p class="eyebrow">LOCAL ADMINISTRATION</p><h1 id="login-title">{{TITLE}}</h1><p class="intro">{{INTRO}}</p><form id="admin-login-form"><label for="admin-password">Administrator password</label><input id="admin-password" name="password" type="password" autocomplete="{{AUTOCOMPLETE}}" minlength="10" maxlength="128" required aria-describedby="password-help login-status" {{DISABLED}}><p id="password-help">10–128 characters.</p><button id="unlock" type="submit" {{DISABLED}}>{{BUTTON}}</button></form><p id="login-status" role="alert" tabindex="-1">{{ERROR}}</p></section></main></body></html>
