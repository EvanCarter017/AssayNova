<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="admin-auth-mode" content="{{MODE}}"><meta name="admin-auth-csrf" content="{{CSRF}}"><title>{{TITLE}} · AssayNova Admin</title><link rel="stylesheet" href="/admin/login.css"><script type="module" src="/admin/login.js"></script></head>
<body><main class="login-shell"><div class="login-header"><a class="brand" href="/admin">AssayNova<span>ADMIN</span></a><select id="admin-language" class="admin-language" aria-label="Admin language" data-i18n-aria-label="language"><option value="en">English</option><option value="zh-CN">中文</option></select></div><section class="login-card" aria-labelledby="login-title"><p class="eyebrow" data-i18n="localAdministration">LOCAL ADMINISTRATION</p><h1 id="login-title">{{TITLE}}</h1><p class="intro" id="login-intro">{{INTRO}}</p><form id="admin-login-form"><label for="admin-password" data-i18n="passwordLabel">Administrator password</label><input id="admin-password" placeholder="Enter administrator password" data-i18n-placeholder="passwordPlaceholder" name="password" type="password" autocomplete="{{AUTOCOMPLETE}}" minlength="10" maxlength="128" required aria-describedby="password-help login-status" {{DISABLED}}><p id="password-help" data-i18n="passwordHelp">10–128 characters.</p><button id="unlock" type="submit" {{DISABLED}}>{{BUTTON}}</button></form><p id="login-status" role="alert" tabindex="-1">{{ERROR}}</p></section></main></body></html>
